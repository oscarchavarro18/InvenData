# Producción de InvenData en el VPS: base de datos, aplicación (Gunicorn), nginx con HTTPS y
# renovación automática del certificado. Solo nginx queda expuesto; la base y la aplicación
# viven en la red interna. Uso: docker compose -f docker-compose.prod.yml up -d --build
name: invendata-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${INVENDATA_ENV:-.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: prod
    image: invendata-web:prod
    restart: unless-stopped
    env_file: ${INVENDATA_ENV:-.env}
    volumes:
      - media:/app/media  # fotos y evidencias: se sirven solo a través de la aplicación
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO en el archivo .env}
    entrypoint: ["/bin/sh", "/plantillas/iniciar.sh"]
    ports:
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
    volumes:
      - ./docker/nginx:/plantillas:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Intenta renovar dos veces al día; certbot solo renueva cuando faltan menos de 30 días.
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

volumes:
  pgdata:
  media:
  letsencrypt:
  certbot-www:
