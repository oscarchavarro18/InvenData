<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}InvenData{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark" style="background:#13213A">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'inicio' %}">InvenData</a>
      {% if user.is_authenticated %}
      <a class="nav-link text-white-50 me-auto ms-4" href="{% url 'recepcion:documento_lista' %}">Recepción</a>
      <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-3 m-0">
        {% csrf_token %}
        <span class="text-white-50 small">{{ user.nombre_completo }} · {{ user.perfil }}</span>
        <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
      </form>
      {% endif %}
    </div>
  </nav>
  <main class="container py-4">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
