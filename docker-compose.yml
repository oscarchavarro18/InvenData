# Entorno de desarrollo de InvenData: aplicación web (Django) + base de datos (PostgreSQL 16).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invendata}
      POSTGRES_USER: ${POSTGRES_USER:-invendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invendata_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # permite conectar DBeaver o pgAdmin desde Windows a localhost:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: dev
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    command: sh docker/entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
