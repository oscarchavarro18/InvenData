name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  calidad-y-pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: invendata
          POSTGRES_USER: invendata
          POSTGRES_PASSWORD: invendata_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invendata -d invendata"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: clave-solo-para-ci
      POSTGRES_DB: invendata
      POSTGRES_USER: invendata
      POSTGRES_PASSWORD: invendata_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Estilo (ruff)
        run: ruff check . && ruff format --check .
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas con cobertura
        run: pytest --cov --cov-report=term-missing
