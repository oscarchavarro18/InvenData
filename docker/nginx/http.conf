# Modo inicial, sin certificado: valida el dominio con Let's Encrypt y atiende por HTTP.
server {
    listen 80;
    server_name ${DOMINIO};
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /plantillas/comun.inc;
        proxy_pass http://web:8000;
    }
}
